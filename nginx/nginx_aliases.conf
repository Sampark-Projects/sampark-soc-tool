# Public addresses for tools whose built-in names should not show in the browser.
#   /packetvault/...  -> the Arkime app (still reachable at /arkime/...)
#   /assetregistry/... -> NetBox       (still reachable at /netbox/...)
# The request path is mapped back to the real one, and every page, script and JSON answer that comes back is rewritten so
# that links and API calls keep using the new address. Included inside the HTTPS server block, next to location /arkime.
# NOT TESTED against a running stack: try it on a copy of the server first.

    location /packetvault {
      include /etc/nginx/nginx_auth_rt.conf;
      rewrite ^/packetvault(.*)$ /arkime$1 break;
      proxy_pass $arkime_protocol://arkime;
      proxy_redirect ~^(https?://[^/]+)?/arkime(.*)$ $1/packetvault$2;
      proxy_cookie_path /arkime /packetvault;
      proxy_set_header Authorization "";
      proxy_set_header Accept-Encoding "";
      include /etc/nginx/nginx_proxy_forward_headers.conf;
      header_filter_by_lua_block { ngx.header.content_length = nil; ngx.header.etag = nil }
      body_filter_by_lua_block {
        local ct = ngx.header.content_type or ""
        if not (ct:find("text/html", 1, true) or ct:find("javascript", 1, true) or ct:find("json", 1, true) or ct:find("text/css", 1, true)) then return end
        local buf = ngx.ctx.buf or {}
        local chunk, eof = ngx.arg[1], ngx.arg[2]
        if chunk ~= "" then buf[#buf + 1] = chunk end
        ngx.ctx.buf = buf
        if not eof then ngx.arg[1] = nil return end
        local s = table.concat(buf)
        s = s:gsub("\\/arkime([^%w_%-])", "\\/packetvault%1"):gsub("/arkime([^%w_%-])", "/packetvault%1"):gsub("/arkime$", "/packetvault")
        if ct:find("text/html", 1, true) then
          s = s:gsub("</head>", '<link rel="stylesheet" href="/ui/arkime-theme.css?v=9"><script src="/ui/arkime-theme.js?v=9"></script></head>', 1)
        end
        ngx.arg[1] = s
      }
    }

    location /assetregistry {
      include /etc/nginx/nginx_auth_rt.conf;
      rewrite ^/assetregistry(.*)$ /netbox$1 break;
      proxy_pass http://netbox;
      proxy_redirect ~^(https?://[^/]+)?/netbox(.*)$ $1/assetregistry$2;
      proxy_cookie_path /netbox /assetregistry;
      proxy_set_header Accept-Encoding "";
      include /etc/nginx/nginx_proxy_forward_headers.conf;
      header_filter_by_lua_block { ngx.header.content_length = nil; ngx.header.etag = nil }
      body_filter_by_lua_block {
        local ct = ngx.header.content_type or ""
        if not (ct:find("text/html", 1, true) or ct:find("javascript", 1, true) or ct:find("json", 1, true) or ct:find("text/css", 1, true)) then return end
        local buf = ngx.ctx.buf or {}
        local chunk, eof = ngx.arg[1], ngx.arg[2]
        if chunk ~= "" then buf[#buf + 1] = chunk end
        ngx.ctx.buf = buf
        if not eof then ngx.arg[1] = nil return end
        local s = table.concat(buf)
        s = s:gsub("\\/netbox([^%w_%-])", "\\/assetregistry%1"):gsub("/netbox([^%w_%-])", "/assetregistry%1"):gsub("/netbox$", "/assetregistry")
        ngx.arg[1] = s
      }
    }
